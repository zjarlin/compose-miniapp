server {
    listen 18192;
    server_name _;
    root /opt/compose-miniapp/site;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:18192/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /ready {
        proxy_pass http://127.0.0.1:18192/ready;
    }

    location = /health {
        proxy_pass http://127.0.0.1:18192/health;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
